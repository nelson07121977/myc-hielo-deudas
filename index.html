function sanitizeForFirebase(obj){
  if(obj===undefined||obj===null)return null;
  if(Array.isArray(obj))return obj.map(sanitizeForFirebase);
  if(typeof obj==='object'){const out={};for(const k in obj){const v=obj[k];if(v!==undefined)out[k]=sanitizeForFirebase(v);}return out;}
  return obj;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} if(window.__invalidateDebtCache) window.__invalidateDebtCache(); }
function dbSet(path, value){
  if(!fbRef) return Promise.resolve(false);
  return fbRef.child(path).set(sanitizeForFirebase(value))
    .then(()=>true)
    .catch(e=>{ console.warn('fbSet',path,e.message); try{alert('⚠️ Error al guardar en la nube:\n'+path+'\n'+e.message);}catch(_){} return false; });
}
function dbUpdate(path, patch){
  if(!fbRef) return Promise.resolve(false);
  return fbRef.child(path).update(sanitizeForFirebase(patch))
    .then(()=>true)
    .catch(e=>{ console.warn('fbUpdate',path,e.message); return false; });
}
function dbSetItem(collection, item){
  if(!fbRef || !item || !item.id) return Promise.resolve(false);
  if(Array.isArray(data[collection])){
    const idx = data[collection].findIndex(x => x && String(x.id) === String(item.id));
    if(idx >= 0) data[collection][idx] = item;
    else data[collection].unshift(item);
  }
  save();
  return fbRef.child(collection+'/'+item.id).set(sanitizeForFirebase(item))
    .then(()=>true)
    .catch(e=>{ console.warn('dbSetItem',collection,e.message); return false; });
}
function initFirebase(){
  try{
    if(typeof firebase==='undefined'){ console.warn('Firebase SDK no cargado'); return false; }
    if(!firebase.apps.length) firebase.initializeApp({ databaseURL: APP.firebase.databaseURL });
    fbRef = firebase.database().ref(APP.firebase.rootNode);
    return true;
  }catch(e){ console.warn('Firebase init fail:',e); return false; }
}
function cleanDriverCollection(arr){
  return (Array.isArray(arr) ? arr : []).filter(x => x && typeof x === 'object' && x.id && String(x.id) !== 'undefined');
}
function mergeById(remoteArr, localArr){
  const remote = Array.isArray(remoteArr) ? remoteArr : [];
  const local  = Array.isArray(localArr)  ? localArr  : [];
  const byId = new Map();
  for(const x of remote){ if(x && x.id) byId.set(String(x.id), x); }
  for(const x of local){
    if(!x || !x.id) continue;
    const id = String(x.id);
    if(byId.has(id)) continue;
    byId.set(id, x);
  }
  return Array.from(byId.values());
}
function attachListener(){
  if(!fbRef) return;
  if(fbListener) fbRef.off("value", fbListener);
  let renderTimer = null;
  const scheduleRender = () => {
    if(renderTimer) return;
    renderTimer = setTimeout(() => {
      renderTimer = null;
      try { if(typeof render==='function') render(); } catch(e){}
    }, 120);
  };

  fbListener = fbRef.on("value", snap => {
    const remoto = snap.val();
    if(!remoto) return;

    const coleccionesChofer = ['driverSales','driverDays','driverGastos','driverStock','pedidos'];
    for(let i=0;i<coleccionesChofer.length;i++){
      const k = coleccionesChofer[i];
      if(remoto[k] !== undefined){
        const remArr = cleanDriverCollection(Object.values(remoto[k] || {}));

        if(k === 'driverDays'){
          const localMap = new Map((data.driverDays||[]).map(d => [String(d.id), d]));
          const merged = remArr.map(r => {
            const loc = localMap.get(String(r.id));
            if(loc && loc.read === true && r.read !== true){
              dbSet('driverDays/'+r.id+'/read', true);
              return { ...r, read: true };
            }
            return r;
          });
          const remIds = new Set(remArr.map(x=>String(x.id)));
          (data.driverDays||[]).forEach(d => {
            if(d && d.id && !remIds.has(String(d.id)) && d.read === true){
              merged.push(d);
            }
          });
          data[k] = merged;
        } else {
          data[k] = remArr;
        }
      }
    }

    const coleccionesAdmin = ['orders','payments','visits','leads','expenses'];
    for(let i=0;i<coleccionesAdmin.length;i++){
      const k = coleccionesAdmin[i];
      if(remoto[k] !== undefined) data[k] = mergeById(remoto[k], data[k]);
    }
    if(remoto.clients !== undefined) data.clients = mergeById(remoto.clients, data.clients);
    if(remoto.products !== undefined)     data.products     = remoto.products;
    if(remoto.settings !== undefined)     data.settings     = remoto.settings;
    if(remoto.paymentSheet !== undefined) data.paymentSheet = remoto.paymentSheet;

    if(window.__invalidateDebtCache) window.__invalidateDebtCache();
    save();
    try { if(typeof migrateData==='function') migrateData(); } catch(e){}
    scheduleRender();
  }, err => console.warn('[fb] listener err', err.message));
}
async function readRemoteOnce(){
  return new Promise(resolve=>{
    if(!fbRef) return resolve(null);
    let done=false; const to=setTimeout(()=>{if(!done){done=true;resolve(null);}},8000);
    fbRef.once("value",snap=>{if(done)return;done=true;clearTimeout(to);resolve(snap.val()||null);},err=>{if(done)return;done=true;clearTimeout(to);console.warn('[fb] read err',err.message);resolve(null);});
  });
}

        localStorage.removeItem(KEY);
        localStorage.removeItem(APP.storage.bootstrap);

        setTimeout(() => window.location.reload(), 500);

}
function clientDebt(clientId,forDriver){
  const cid=String(clientId);const c=findClient(cid);
  if(forDriver&&c&&c.hideDebtFromDriver)return 0;
  let owed=0,paid=0;
  (data.orders||[]).forEach(o=>{if(String(o.clientId)===cid&&o.payment==='Cuenta corriente'&&o.status!=='Cancelado'){if(forDriver&&o.hideFromDriver)return;owed+=Number(o.total||0);}});
  (data.driverSales||[]).forEach(s=>{if(String(s.clientId)!==cid)return;if(forDriver&&s.hideFromDriver)return;if(s.payment==='ctacte')owed+=Number(s.total||0);if(s.payment==='cobrocc')paid+=Number(s.collection||0);});
  (data.payments||[]).forEach(p=>{if(String(p.clientId)===cid){if(forDriver&&p.hideFromDriver)return;paid+=Number(p.amount||0);}});
  return owed-paid;
}
function clientDebtInfo(clientId,forDriver){
  const cid=String(clientId);
  const c=(data.clients||[]).find(x=>String(x.id)===cid);
  if(forDriver && c && c.hideDebtFromDriver) return {total:0,oldest:null,businessDays:0,isOverdue:false,movimientos:[]};
  let owed=0; let paid=0; const mv=[];
  const orders = data.orders || [];
  for(let i=0; i<orders.length; i++){
      const o = orders[i];
      if(String(o.clientId)===cid && o.payment==='Cuenta corriente' && o.status!=='Cancelado'){
          if(forDriver && o.hideFromDriver) continue;
          const amt = Number(o.total||0); owed += amt; mv.push({date:o.date,amount:amt,type:'deuda'});
      }
  }
  const sales = data.driverSales || [];
  for(let i=0; i<sales.length; i++){
      const s = sales[i];
      if(String(s.clientId)!==cid) continue;
      if(forDriver && s.hideFromDriver) continue;
      if(s.payment==='ctacte'){ const amt = Number(s.total||0); owed += amt; mv.push({date:s.date,amount:amt,type:'deuda'}); }
      else if(s.payment==='cobrocc'){ const amt = Number(s.collection||0); paid += amt; mv.push({date:s.date,amount:amt,type:'pago'}); }
  }
  const payments = data.payments || [];
  for(let i=0; i<payments.length; i++){
      const p = payments[i];
      if(String(p.clientId)===cid){
          if(forDriver && p.hideFromDriver) continue;
          const amt = Number(p.amount||0); paid += amt; mv.push({date:p.date,amount:amt,type:'pago'});
      }
  }
  const total = owed - paid;
  let run=0, start=null;
  const sorted = mv.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  for(const m of sorted){ if(m.type==='deuda') run+=m.amount; else run-=m.amount; if(run>0 && !start) start=m.date; if(run<=0) start=null; }
  if(run<=0) start=null;
  const deudas = mv.filter(m=>m.type==='deuda');
  const oldest = start || (deudas.length ? deudas[0].date : null);
  const businessDays = oldest ? businessDaysBetween(oldest, today()) : 0;
  const isOverdue = businessDays > DEBT_ALERT_BUSINESS_DAYS && total > 0;
  return {total, oldest, businessDays, isOverdue, movimientos: mv};
}
function totalDebt(){return (data.clients||[]).reduce((s,c)=>s+Math.max(0,clientDebt(c.id)),0);}
let _debtCache = { stamp: 0, byClient: null };
function buildDebtMap(forDriver){
  const stamp = (data.orders?.length||0) + '|' + (data.driverSales?.length||0) + '|' + (data.payments?.length||0) + '|' + (forDriver ? '1' : '0');
  if(_debtCache.byClient && _debtCache.stamp === stamp) { return _debtCache.byClient; }
  const map = new Map();
  const get = (cid) => { let e = map.get(cid); if(!e){ e = { owed:0, paid:0, movimientos:[] }; map.set(cid, e); } return e; };
  const orders = data.orders || [];
  for(let i=0;i<orders.length;i++){
    const o = orders[i];
    if(o.payment !== 'Cuenta corriente' || o.status === 'Cancelado') continue;
    if(forDriver && o.hideFromDriver) continue;
    const amt = Number(o.total||0); const e = get(String(o.clientId)); e.owed += amt; e.movimientos.push({ date:o.date, amount:amt, type:'deuda' });
  }
  const sales = data.driverSales || [];
  for(let i=0;i<sales.length;i++){
    const s = sales[i];
    if(forDriver && s.hideFromDriver) continue;
    const e = get(String(s.clientId));
    if(s.payment === 'ctacte'){ const amt = Number(s.total||0); e.owed += amt; e.movimientos.push({ date:s.date, amount:amt, type:'deuda' }); }
    else if(s.payment === 'cobrocc'){ const amt = Number(s.collection||0); e.paid += amt; e.movimientos.push({ date:s.date, amount:amt, type:'pago' }); }
  }
  const payments = data.payments || [];
  for(let i=0;i<payments.length;i++){
    const p = payments[i];
    if(forDriver && p.hideFromDriver) continue;
    const e = get(String(p.clientId)); const amt = Number(p.amount||0); e.paid += amt; e.movimientos.push({ date:p.date, amount:amt, type:'pago' });
  }
  _debtCache = { stamp, byClient: map };
  return map;
}
function clientsWithDebt(forDriver){
  const map = buildDebtMap(forDriver);
  const out = [];
  const clients = data.clients || [];
  for(let i=0;i<clients.length;i++){
    const c = clients[i];
    if(forDriver && c.hideDebtFromDriver) continue;
    const e = map.get(String(c.id));
    if(!e) continue;
    const total = e.owed - e.paid;
    if(total <= 0) continue;
    out.push({ client:c, info: { total, oldest: null, businessDays: 0, isOverdue: false, movimientos: e.movimientos } });
  }
  out.sort((a,b)=>b.info.total-a.info.total);
  return out;
}

function driverOnClientChange(){const cid=$('dSelClient').value;const info=$('dClientInfo');if(!cid){info.style.display='none';driverResetPrices();return;}const c=findClient(cid);if(!c)return;const di=clientDebtInfo(cid,true);const pr=c.prices||{};const defP=id=>Number(findProduct(id)?.price)||0;$('dP17').value=pr.p17!==undefined?pr.p17:defP('p17');$('dP35').value=pr.p35!==undefined?pr.p35:defP('p35');$('dP14').value=pr.p14!==undefined?pr.p14:defP('p14');$('dP20').value=pr.p20!==undefined?pr.p20:defP('p20');$('dP32').value=pr.p32!==undefined?pr.p32:defP('p32');const pay=c.payment==='ctacte'?'📋 Cta Cte':c.payment==='efectivo'?'💵 Efectivo':'💳 Transf';const dTxt=di.total>0?`<b style="color:var(--red)">Debe: ${money(di.total)}${di.businessDays>0?' · '+di.businessDays+' días':''}</b>`:'<span style="color:var(--green)">Sin deuda</span>';const badges=eqBadges(c);info.style.display='block';info.innerHTML=`<b>${esc(c.name)}</b> · #${esc(c.code)} · ${pay}<br>${dTxt}${badges?`<div style="margin-top:8px;">${badges}</div>`:''}`;driverUpdateTotal();}
function driverResetPrices(){$('dP17').value=1500;$('dP35').value=2500;$('dP14').value=6500;$('dP20').value=8000;$('dP32').value=12000;driverUpdateTotal();}
function driverSaveClientPrices(){const cid=$('dSelClient').value; if(!cid) return toast('Elegí cliente');const c=findClient(cid); if(!c) return;c.prices={p17:Number($('dP17').value)||0,p35:Number($('dP35').value)||0,p14:Number($('dP14').value)||0,p20:Number($('dP20').value)||0,p32:Number($('dP32').value)||0};dbSet('clients/'+cid+'/prices', c.prices);save();toast('Precios guardados');}
function driverUpdateTotal(){const t=(Number($('dQ17')?.value)||0)*(Number($('dP17')?.value)||0)+(Number($('dQ35')?.value)||0)*(Number($('dP35')?.value)||0)+(Number($('dQ14')?.value)||0)*(Number($('dP14')?.value)||0)+(Number($('dQ20')?.value)||0)*(Number($('dP20')?.value)||0)+(Number($('dQ32')?.value)||0)*(Number($('dP32')?.value)||0);const el=$('dTotalPreview');if(el)el.textContent=money(t);}

function driverAddSale(){
  const cid=$('dSelClient').value;if(!cid)return toast('Elegí cliente');

function guardarAjusteDeuda(clientId){
  const raw = $('ajMonto').value;

  const c = findClient(clientId);
  if(!c) return;
  const detalle = ($('ajDetalle').value||'').trim() || 'Ajuste manual de deuda';
  const abs = Math.abs(monto);
  const esDeuda = monto > 0;
  if(esDeuda){
    const ajuste = { id: uid(), date: today(), created: Date.now(), clientId: clientId, name: c.name, phone: c.phone || '', address: '', payment: 'Cuenta corriente', items: [{ name: detalle, q: 1, price: abs }], total: abs, status: 'Entregado', note: 'Ajuste de deuda' };
    data.orders.unshift(ajuste);
    dbSetItem('orders', ajuste);
    toast('✅ Deuda ajustada +' + money(abs));
  } else {
    const pago = { id: uid(), created: Date.now(), clientId: clientId, amount: abs, method: 'Ajuste', date: today(), note: detalle };
    data.payments.unshift(pago);
    dbSetItem('payments', pago);
    toast('✅ Deuda ajustada −' + money(abs));
  }
  if(window.__invalidateDebtCache) window.__invalidateDebtCache();
  save();
  closeModal();
  render();
}

function pedOnClientChange(){const cid=$('pedClient').value;if(!cid)return;const c=findClient(cid);if(!c)return;$('pedName').value=c.name||'';$('pedPhone').value=c.phone||'';$('pedAddress').value=(c.addresses&&c.addresses[0])||'';}
function savePedido(){
  try{
    const cid=$('pedClient').value||null;
    const name=$('pedName').value.trim();
    const phone=$('pedPhone').value.trim();
    const address=$('pedAddress').value.trim();
    const date=$('pedDate').value||today();
    const driver=String($('pedDriver').value||'');
    const note=$('pedNote').value.trim();
    const qty={'1,7':Number($('pedQ17').value)||0,'3,5':Number($('pedQ35').value)||0,'14':Number($('pedQ14').value)||0,'20':Number($('pedQ20').value)||0,'32':Number($('pedQ32').value)||0};
    if(!name||!address){toast('Completá cliente y dirección');return;}
    if(!Object.values(qty).some(q=>q>0)){toast('Cargá cantidades');return;}
    if(!data.pedidos)data.pedidos=[];
    const newPedido={id:uid(),created:Date.now(),date,clientId:cid,clientName:name,phone:phone,address:address,driver:driver,qty:qty,note:note,status:'pendiente'};
    data.pedidos.unshift(newPedido);
    dbSetItem('pedidos',newPedido);
    save();
    closeModal();
    const dname=getDrivers().find(d=>String(d.pin)===String(driver));
    toast('✅ Pedido guardado'+(dname?' para '+dname.name:''));
    if(window.tab==='pedidos'||window.tab==='recordatorios')render();
  }catch(err){console.error('savePedido error:',err);toast('❌ Error: '+err.message);closeModal();}
}

function exportarBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const fecha=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');a.download='glaciar-backup-'+fecha+'.json';a.click();URL.revokeObjectURL(url);toast('💾 Backup descargado');}
function importarBackup(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const json=JSON.parse(e.target.result);if(!confirm('¿Restaurar?'))return;data=json;migrateData();localStorage.setItem(KEY,JSON.stringify(data));if(fbRef){['clients','orders','payments','driverSales','products','settings','pedidos','expenses','driverGastos','driverDays','driverStock'].forEach(k=>{fbRef.child(k).set(sanitizeForFirebase(data[k]||[]));});}toast('✅ Restaurado');render();}catch(err){toast('❌ Archivo inválido');}};reader.readAsText(file);input.value='';}
function resetearTodo(){if(!confirm('⚠️ ¿Borrar TODO?'))return;if(!confirm('⚠️ ¿SEGURO?'))return;localStorage.removeItem(KEY);localStorage.removeItem('glaciar_deudas_v4_loaded');location.reload();}

function imprimirPlanillaDia(){
  const filt=window.driverDayFilter||{date:today(),pin:''};
  const sales=(data.driverSales||[]).filter(s=>s.date===filt.date&&(!filt.pin||String(s.pin)===String(filt.pin)));
  const gastos=(data.driverGastos||[]).filter(g=>g.date===filt.date&&(!filt.pin||String(g.pin)===String(filt.pin)));
  if(!sales.length&&!gastos.length)return toast('No hay movimientos');
  let ef=0,tf=0,cc=0,cbEf=0,cbTf=0,bolsas=0;
  const totalesPorProd={'1,7':0,'3,5':0,'14':0,'20':0,'32':0};

    if(s.payment==='efectivo')ef+=Number(s.total||0);

    Object.entries(s.qty||{}).forEach(([k,q])=>{const n=Number(q||0);bolsas+=n;if(totalesPorProd[k]!==undefined) totalesPorProd[k]+=n;});
  });
  const gastosTotal=gastos.reduce((a,g)=>a+Number(g.amount||0),0);
  const netoEntregar=ef+cbEf-gastosTotal;
  const netoTotal=ef+tf+cbEf+cbTf-gastosTotal;

    const totalBolsasVenta = Object.values(s.qty||{}).reduce((a,b)=>a+Number(b||0),0);

    return `<tr><td>${esc(s.clientName||'—')}${notaHtml}</td><td>${detalleBolsas}${totalBolsasVenta>0?` <span class="muted">(${totalBolsasVenta})</span>`:''}</td><td>${payLabel}</td><td style="text-align:right;font-weight:700;">${money(monto)}</td></tr>`;

  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Planilla ${filt.date}</title><style>body{font-family:Inter,system-ui,sans-serif;padding:24px;color:#1e293b}h1{font-family:Georgia,serif;font-size:22px;margin:0 0 6px}h2{font-size:14px;color:#0f2352;border-bottom:2px solid #0f2352;padding-bottom:6px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.04em}.sub{color:#64748b;font-size:12px;margin-bottom:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:7px 9px;text-align:left;vertical-align:top}th{background:#eef5ff;font-weight:700;color:#0f2352}tr:nth-child(even) td{background:#fafcff}.muted{color:#64748b;font-size:11px}.nota{font-size:11px;color:#78350f;background:#fffbeb;border-left:3px solid #fbbf24;padding:4px 8px;border-radius:4px;margin-top:4px;font-weight:600}.chip{display:inline-block;background:#eef5ff;border:1px solid #bfdbfe;color:#0b3bb8;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:800;margin:3px 4px 3px 0}.total-box{margin-top:14px;padding:14px 18px;background:#fffbeb;border:2px solid #e8b961;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.total-box span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.total-box b{font-size:22px;color:#b8860b;font-family:Georgia,serif}.total-box.blue{border-color:#38d4ff;background:#ecfeff}.total-box.blue b{color:#0b3bb8}.resumen-line{font-size:12.5px;line-height:1.9;margin:8px 0}.resumen-line b{color:#0f2352}@media print{body{padding:12px}}</style></head><body><h1>🧊 GLACIAR · M&C Hielo</h1><div class="sub"><b>Planilla del día:</b> ${fdate(filt.date)} · <b>Chofer:</b> ${esc(driverLabel)}</div><h2>Resumen general</h2><div class="resumen-line">💵 Efectivo: <b>${money(ef)}</b> · 💳 Transf: <b>${money(tf)}</b> · 📋 Cta Cte: <b>${money(cc)}</b><br>🔄 Cobros Ef.: <b>${money(cbEf)}</b> · 🔄 Cobros Transf.: <b>${money(cbTf)}</b> · 💸 Gastos: <b>${money(gastosTotal)}</b><br   w.document.close();
  setTimeout(()=>{try{w.print();}catch(e){}},500);
}
function copiarPlanillaDia(){const filt=window.driverDayFilter||{date:today(),pin:''};const sales=(data.driverSales||[]).filter(s=>s.date===filt.date&&(!filt.pin||String(s.pin)===String(filt.pin)));const gastos=(data.driverGastos||[]).filter(g=>g.date===filt.date&&(!filt.pin||String(g.pin)===String(filt.pin)));let ef=0,tf=0,cc=0,cbEf=0,cbTf=0;sales.forEach(s=>{if(s.payment==='efectivo')ef+=Number(s.total||0);if(s.payment==='transferencia')tf+=Number(s.total||0);if(s.payment==='ctacte')cc+=Number(s.total||0);if(s.payment==='cobrocc'){const m=s.collectionMethod||'efectivo';if(m==='transferencia')cbTf+=Number(s.collection||0);else cbEf+=Number(s.collection||0);}});const gastosTotal=gastos.reduce((a,g)=>a+Number(g.amount||0),0);let txt=`🧊 GLACIAR · Planilla ${fdate(filt.date)}\n\n💵 Efectivo: ${money(ef)}\n💳 Transf: ${money(tf)}\n📋 Cta Cte: ${money(cc)}\n🔄 Cobros Ef.: ${money(cbEf)}\n🔄 Cobros Transf.: ${money(cbTf)}\n💸 Gastos: ${money(gastosTotal)}\n💰 Neto efectivo: ${money(ef+cbEf-gastosTotal)}\n📊 Neto total: ${money(ef+tf+cbEf+cbTf-gastosTotal)}\n\nVENTAS:\n`;sales.forEach(s=>{const items=Object.entries(s.qty||{}).filter(([,q])=>q>0).map(([k,q])=>`${q}× ${k}kg`).join(' · ')||'—';const pl=s.payment==='cobrocc'?('cobrocc '+(s.collectionMethod==='transferencia'?'transf':'ef')):s.payment;txt+=`• ${s.clientName} · ${items} · ${money(s.total||s.collection)} (${pl})\n`;});if(gastos.length){txt+='\nGASTOS:\n';gastos.forEach(g=>{txt+=`• ${g.category}${g.detail?' · '+g.detail:''} · ${money(g.amount)}\n`;});}navigator.clipboard.writeText(txt).then(()=>toast('📋 Copiado'));}

function financeAdmin(){
  const todayStr = today();
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - 7); const weekStr = weekStart.toISOString().slice(0,10);
  const monthStart = todayStr.slice(0,7) + '-01';

  const calc = (from) => {
    let ventasEf = 0, ventasTf = 0, ventasCc = 0;
    let cobrosEf = 0, cobrosTf = 0;
    let costoMercaderia = 0;
    let gastosCamion = 0;
    let gastosAdmin = 0;

    (data.driverSales||[]).forEach(s => {
      if(s.date < from) return;
      if(s.payment === 'efectivo') ventasEf += Number(s.total||0);
      if(s.payment === 'transferencia') ventasTf += Number(s.total||0);
      if(s.payment === 'ctacte') ventasCc += Number(s.total||0);
      if(s.payment === 'cobrocc') {
        const m = s.collectionMethod || 'efectivo';
        if(m === 'transferencia') cobrosTf += Number(s.collection||0); else cobrosEf += Number(s.collection||0);
      }
      costoMercaderia += Number(s.cost||0);
    });

    (data.driverGastos||[]).forEach(g => { if(g.date >= from) gastosCamion += Number(g.amount||0); });
    (data.expenses||[]).forEach(g => { if(g.date >= from) gastosAdmin += Number(g.amount||0); });

    const totalVentas = ventasEf + ventasTf + ventasCc;
    const totalCobros = cobrosEf + cobrosTf;
    const totalGastos = gastosCamion + gastosAdmin;

    const gananciaReal = ventasEf + ventasTf + totalCobros - costoMercaderia - totalGastos;

    return { ventasEf, ventasTf, ventasCc, cobrosEf, cobrosTf, costoMercaderia, gastosCamion, gastosAdmin, totalVentas, totalCobros, totalGastos, gananciaReal };
  };

  const hoy = calc(todayStr);
  const semana = calc(weekStr);
  const mes = calc(monthStart);

  const contenido = `
  <section class="grid" style="grid-template-columns:repeat(3, 1fr);">
    <div class="kpi blue">
      <label>GANANCIA REAL HOY</label>
      <b>${money(hoy.gananciaReal)}</b>
      <span class="muted" style="font-size:11px;margin-top:8px;display:block;">Ventas: ${money(hoy.totalVentas)} | Cobros: ${money(hoy.totalCobros)} | Costo: ${money(hoy.costoMercaderia)} | Gastos: ${money(hoy.totalGastos)}</span>
    </div>
    <div class="kpi purple">
      <label>GANANCIA REAL SEMANA</label>
      <b>${money(semana.gananciaReal)}</b>
      <span class="muted" style="font-size:11px;margin-top:8px;display:block;">Ventas: ${money(semana.totalVentas)} | Cobros: ${money(semana.totalCobros)} | Costo: ${money(semana.costoMercaderia)} | Gastos: ${money(semana.totalGastos)}</span>
    </div>
    <div class="kpi green">
      <label>GANANCIA REAL MES</label>
      <b>${money(mes.gananciaReal)}</b>
      <span class="muted" style="font-size:11px;margin-top:8px;display:block;">Ventas: ${money(mes.totalVentas)} | Cobros: ${money(mes.totalCobros)} | Costo: ${money(mes.costoMercaderia)} | Gastos: ${money(mes.totalGastos)}</span>
    </div>
  </section>

  <section class="panel">
    <h3>📊 Desglose del Mes (Real)</h3>
    <div class="gasto-cat-row" style="color:var(--green);font-weight:700;"><span>+ Ventas Efectivo</span><b>${money(mes.ventasEf)}</b></div>
    <div class="gasto-cat-row" style="color:var(--green);font-weight:700;"><span>+ Ventas Transferencia</span><b>${money(mes.ventasTf)}</b></div>
    <div class="gasto-cat-row" style="color:var(--purple);font-weight:700;"><span>+ Cobros Cta Cte (Ef + Tr)</span><b>${money(mes.totalCobros)}</b></div>
    <div class="gasto-cat-row" style="color:var(--muted);"><span>Ventas a Cuenta Corriente (No entra plata aún)</span><b>${money(mes.ventasCc)}</b></div>
    <div class="gasto-cat-row" style="color:var(--red);"><span>− Costo de Mercadería Vendida</span><b>- ${money(mes.costoMercaderia)}</b></div>
    <div class="gasto-cat-row" style="color:var(--red);"><span>− Gastos Choferes (Nafta/Sueldos)</span><b>- ${money(mes.gastosCamion)}</b></div>
    <div class="gasto-cat-row" style="color:var(--red);"><span>− Gastos Admin (Manuales)</span><b>- ${money(mes.gastosAdmin)}</b></div>
    <div class="gasto-total-row" style="background:var(--ice);border-color:var(--blue);color:var(--blue-dark);">
      <span>💰 GANANCIA REAL DEL MES</span><span style="font-size:24px;">${money(mes.gananciaReal)}</span>
    </div>
  </section>

  <section class="panel">
    <h3>💼 Gastos admin (Manuales)</h3>
    <div class="field no-print"><label>Concepto</label><input id="exName"></div>
    <div class="field no-print"><label>Monto</label><input id="exAmount" type="number"></div>
    <button class="btn primary no-print" onclick="addExpense()">+ Registrar</button>
    <div style="margin-top:14px;">${(data.expenses||[]).slice(0,30).map(x=>`<div class="row space" style="padding:8px 0;border-bottom:1px solid var(--line-2);"><span>${esc(x.name)} <small class="muted">${x.date}</small></span><div><b>${money(x.amount)}</b> <button class="btn xs danger no-print" onclick="deleteExpense('${x.id}')">🗑</button></div></div>`).join('')||'<p class="muted">Sin gastos.</p>'}</div>
  </section>`;
  return wrapSeccion('secFinanzas','💼 Finanzas (Ganancia Real)',contenido);
}
function addExpense(){const n=$('exName').value.trim(),a=Number($('exAmount').value);if(!n||!a)return toast('Completá');const nuevo={id:uid(),name:n,amount:a,date:today()};data.expenses.unshift(nuevo);dbSetItem('expenses',nuevo);save();render();}
function deleteExpense(id){if(!confirm('¿Eliminar?'))return;data.expenses=data.expenses.filter(x=>x.id!==id);dbSet('expenses/'+id,null);save();render();}
function adminFacturar(){const co=(data.clients||[]).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)} · #${c.code}</option>`).join('');const hs=today();const pd=hs.slice(0,7)+'-01';return `<section class="panel"><h3 style="margin:0 0 14px;">📄 Facturar por Cliente</h3><div class="threecol no-print"><div class="field"><label>👤 Cliente</label><select id="facClient"><option value="">— Elegí —</option>${co}</select></div><div class="field"><label>📅 Desde</label><input type="date" id="facDesde" value="${pd}"></div><div class="field"><label>📅 Hasta</label><input type="date" id="facHasta" value="${hs}"></div></div><button class="btn primary no-print" onclick="generarFactura()">📄 Generar factura</button><div id="facturaContainer" style="margin-top:18px;"></div></section>`;}
let facturaActual=null;
function calcularFactura(cid,desde,hasta){const items=[];(data.driverSales||[]).forEach(s=>{if(String(s.clientId)!==String(cid))return;if(s.date<desde||s.date>hasta)return;if(s.payment==='ctacte')items.push({date:s.date,type:'deuda',amount:Number(s.total||0),detail:'Venta',source:'chofer'});if(s.payment==='cobrocc')items.push({date:s.date,type:'pago',amount:Number(s.collection||0),detail:'Cobro',source:'chofer'});});(data.orders||[]).forEach(o=>{if(String(o.clientId)!==String(cid))return;if(o.date<desde||o.date>hasta)return;if(o.payment==='Cuenta corriente'&&o.status!=='Cancelado')items.push({date:o.date,type:'deuda',amount:Number(o.total||0),detail:o.note||'Deuda',source:'manual'});});(data.payments||[]).forEach(p=>{if(String(p.clientId)!==String(cid))return;if(p.date<desde||p.date>hasta)return;items.push({date:p.date,type:'pago',amount:Number(p.amount||0),detail:p.note||'Pago',source:'manual'});});items.sort((a,b)=>(a.date||'').localeCompare(b.date||''));const tD=items.filter(i=>i.type==='deuda').reduce((s,i)=>s+i.amount,0);const tP=items.filter(i=>i.type==='pago').reduce((s,i)=>s+i.amount,0);return {items,totalDeudas:tD,totalPagos:tP,saldoPeriodo:tD-tP,saldoTotal:clientDebt(cid)};}
function generarFactura(){const cid=$('facClient').value;const d=$('facDesde').value;const h=$('facHasta').value;if(!cid)return toast('Elegí cliente');if(!d||!h)return toast('Fechas');if(d>h)return toast('Fechas mal');const c=findClient(cid);if(!c)return;const r=calcularFactura(cid,d,h);facturaActual={client:c,desde:d,hasta:h,...r};const rows=r.items.length?r.items.map(i=>`<tr><td>${fdate(i.date)}</td><td>${esc(i.detail)}</td><td style="color:${i.type==='deuda'?'var(--red)':'var(--green)'};text-align:right;">${i.type==='deuda'?'':'-'}${money(i.amount)}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:var(--muted);">Sin movimientos</td></tr>';$('facturaContainer').innerHTML=`<div class="factura-box" id="facturaBox"><div class="factura-head"><div class="factura-emp">🧊 GLACIAR · M&C Hielo</div></div><div><b>Cliente:</b> ${esc(c.name)} · #${esc(c.code)}<br><span class="muted">Período: ${fdate(d)} al ${fdate(h)}</span></div><div class="factura-resumen"><span>📊 Total: <b>${money(r.totalDeudas)}</b></span><span>💸 Pagos: <b style="color:var(--green)">${money(r.totalPagos)}</b></span><span>🔴 Período: <b style="color:var(--red)">${money(r.saldoPeriodo)}</b></span></div><table class="table"><thead><tr><th>Fecha</th><th>Detalle</th><th style="text-align:right;">Monto</th></tr></thead><tbody>${rows}</tbody></table><div class="factura-total"><span>💰 Total: </span><span class="monto">${money(r.saldoTotal)}</span></div></div>`;toast('✅ Factura generada');}
function adminModifFactura(){const co=(data.clients||[]).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)} · #${c.code}</option>`).join('');const hs=today();const pd=hs.slice(0,7)+'-01';return `<section class="panel"><h3 style="margin:0 0 14px;">✏️ Modificación de Factura</h3><div class="threecol no-print"><div class="field"><label>👤 Cliente</label><select id="modClient"><option value="">— Elegí —</option>${co}</select></div><div class="field"><label>📅 Desde</label><input type="date" id="modDesde" value="${pd}"></div><div class="field"><label>📅 Hasta</label><input type="date" id="modHasta" value="${hs}"></div></div><button class="btn primary no-print" onclick="cargarModificacion()">📥 Cargar movimientos</button><div id="modifContainer" style="margin-top:18px;"></div></section>`;}
let modifItems=[];
function cargarModificacion(){const cid=$('modClient').value;const d=$('modDesde').value;const h=$('modHasta').value;if(!cid)return toast('Elegí cliente');if(!d||!h)return toast('Fechas');const r=calcularFactura(cid,d,h);modifItems=r.items.map((i,idx)=>({...i,_id:'m'+idx}));$('modifContainer').innerHTML=`<div class="factura-resumen"><span><b>🔴 Deudas:</b> ${money(r.totalDeudas)}</span><span><b>🟢 Pagos:</b> ${money(r.totalPagos)}</span><span><b>📊 Saldo:</b> ${money(r.saldoPeriodo)}</span></div><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Detalle</th></tr></thead><tbody>${modifItems.map(i=>`<tr><td>${fdate(i.date)}</td><td>${i.type}</td><td>${money(i.amount)}</td><td>${esc(i.detail||'')}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sin movimientos</td></tr>'}</tbody></table>`;toast(`✅ ${modifItems.length} movimientos`);}
function shareAdmin(){const link=location.href.split('?')[0];return `<section class="panel" style="background:linear-gradient(135deg,#0a1128,#0f2352);color:white;border:0;"><h2 style="font-family:'Fraunces',serif;color:white;">📤 Compartir catálogo</h2><div class="field"><label style="color:rgba(255,255,255,.75);">🔗 Link base</label><input value="${esc(link)}" readonly style="background:rgba(255,255,255,.95);"></div></section>`;}

function updateProduct(id, field, value) {
  const p = findProduct(id); if(!p) return;

function settingsAdmin(){
  const drivers=getDrivers();const h=data.settings.hero||{};
  const driversHtml=drivers.map((d,i)=>`<div class="panel" style="background:var(--ice);border-left:4px solid var(--blue);margin-top:10px;"><div class="row space"><b>🚚 Chofer ${i+1}</b><button class="btn xs danger" onclick="deleteDriver(${i})">🗑 Borrar</button></div><div class="twocol" style="margin-top:10px;"><div class="field"><label>Nombre</label><input value="${esc(d.name)}" onchange="updateDriverName(${i},this.value)"></div><div class="field"><label>PIN</label><input value="${esc(d.pin)}" maxlength="6" inputmode="numeric" onchange="updateDriverPin(${i},this.value)"></div></div></div>`).join('');

    <p class="muted" style="margin-bottom:14px;">Si el celular o la PC muestran datos viejos que no coinciden con la nube (deudas que no aparecen en el celular, etc.), tocá este botón. Subirá TODO lo que tenés en esta PC a la nube de Firebase para que los demás aparatos se actualicen.</p>
    <button class="btn danger" onclick="subirTodoANube()" style="width:100%; padding:14px; font-weight:900; font-size:15px; margin-bottom:10px;">

}
function saveAdminPass(){const p=$('adminPass').value;if(!p||p.length<4)return toast('Clave muy corta');data.settings.adminPass=p;data.settings.whatsapp=$('whatsapp').value.replace(/[^0-9]/g,'');dbSet('settings/adminPass',data.settings.adminPass);dbSet('settings/whatsapp',data.settings.whatsapp);save();toast('✅ Guardado');}
function saveHeroSettings(){if(!data.settings.hero)data.settings.hero={};data.settings.hero.kicker=($('hKicker').value||'').trim();data.settings.hero.title1=($('hTitle1').value||'').trim();data.settings.hero.title2=($('hTitle2').value||'').trim();data.settings.hero.subtitle=($('hSubtitle').value||'').trim();dbSet('settings/hero',data.settings.hero);save();toast('✅ Guardado');render();}
function updateDriverName(i,v){if(!data.settings.drivers[i])return;data.settings.drivers[i].name=v.trim()||('Chofer '+(i+1));dbSet('settings/drivers',data.settings.drivers);save();toast('OK');}
function updateDriverPin(i,v){if(!data.settings.drivers[i])return;const pin=String(v||'').replace(/[^0-9]/g,'').slice(0,6);if(pin.length<3)return toast('PIN muy corto');data.settings.drivers[i].pin=pin;dbSet('settings/drivers',data.settings.drivers);save();toast('OK');}
function deleteDriver(i){if(!confirm('¿Borrar?'))return;data.settings.drivers.splice(i,1);dbSet('settings/drivers',data.settings.drivers);save();render();}
function addDriver(){data.settings.drivers.push({pin:String(1000+data.settings.drivers.length),name:'Chofer '+(data.settings.drivers.length+1)});dbSet('settings/drivers',data.settings.drivers);save();render();}

(async function boot(){
  try{
    migrateData();
    loadInitialDebts();
    if(initFirebase()){
      const remoto = await readRemoteOnce();
      if(remoto){
        let cambios=false;
        const coleccionesChofer = ['driverSales','driverDays','driverGastos','driverStock','pedidos'];
        coleccionesChofer.forEach(k=>{
          if(remoto[k]){
            const remArr = Object.values(remoto[k]||{});
            data[k] = cleanDriverCollection(remArr);
            cambios = true;
          }
        });
        const coleccionesAdmin = ['clients','orders','payments','expenses','leads','visits'];
        coleccionesAdmin.forEach(k=>{
          if(remoto[k]){ data[k] = mergeById(remoto[k], data[k]); cambios = true; }
        });
        if(remoto.products) { data.products = remoto.products; cambios = true; }
        if(remoto.settings) { data.settings = remoto.settings; cambios = true; }
        if(remoto.paymentSheet) { data.paymentSheet = remoto.paymentSheet; cambios = true; }
        if(cambios){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} try{ migrateData(); }catch(e){} }
        attachListener();
      } else {
        attachListener();
      }
    }
  }catch(e){ console.warn('boot:',e); }
  render();
})();
</script>
